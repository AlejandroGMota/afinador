# Afinador web: static site, no backend.
# Install: copy to /etc/nginx/sites-available/afinador, link it in sites-enabled,
# then get the certificate (HTTPS is required for getUserMedia):
#   sudo certbot --nginx --cert-name afinador.alejandrogmota.com \
#     -d afinador.alejandrogmota.com -d afinador.160-34-222-215.sslip.io
server {
    server_name afinador.alejandrogmota.com afinador.160-34-222-215.sslip.io;
    root /var/www/afinador;
    index index.html;

    # The temporary sslip.io address redirects to the domain.
    if ($host = afinador.160-34-222-215.sslip.io) {
        return 301 https://afinador.alejandrogmota.com$request_uri;
    }

    # Only this origin may ask for the microphone.
    add_header Permissions-Policy "microphone=(self)" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/afinador.alejandrogmota.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/afinador.alejandrogmota.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = afinador.alejandrogmota.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = afinador.160-34-222-215.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name afinador.alejandrogmota.com afinador.160-34-222-215.sslip.io;
    return 404; # managed by Certbot




}